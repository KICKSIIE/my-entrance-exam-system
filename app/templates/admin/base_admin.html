<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin/css/base.css') }}">
    {# Each page adds its own module stylesheet here #}
    {% block styles %}{% endblock %}
</head>

<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">Entrance Exam<br>Admin</div>
            <nav>
                <a href="{{ url_for('admin.dashboard') }}"
                    class="{{ 'active' if request.endpoint == 'admin.dashboard' }}">Dashboard</a>
                <a href="{{ url_for('admin.batches') }}"
                    class="{{ 'active' if request.endpoint in ['admin.batches', 'admin.edit_batch'] }}">Manage Exam Schedule</a>
                <a href="{{ url_for('admin.attendance') }}"
                    class="{{ 'active' if request.endpoint == 'admin.attendance' }}">View Attendance</a>
            </nav>
            <div class="sidebar-user">
                <span class="sidebar-user-name">{{ current_user.full_name or current_user.username }}</span>
                <span class="sidebar-user-role">Administrator</span>
            </div>
            <a href="{{ url_for('admin_auth.logout') }}" class="logout">Log Out</a>
        </aside>
        <main class="admin-content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>

</html>
